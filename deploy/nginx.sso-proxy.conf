## SSO split-stack nginx: static SPA + same-origin reverse proxy to the agent.
##
## Chrome Local Network Access blocks the browser from calling :4567 directly
## from the :8090 page (Issues tab, fetch hangs → "Select workspace"). Proxying
## agent APIs through this origin keeps AUTH_BASE on the auth-service while
## making /workspace, /sessions, /chat same-origin.
##
## Pair with docker-compose.sso.yml (API_BASE empty). Do not use this file for
## a web container that cannot resolve the compose hostname `agent`.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 500m;

    include /etc/nginx/conf.d/auth.inc;

    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    location = /app-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Agent API (SSE, uploads, workspace). Keep this list in sync with
    # web vite proxy + lib/api/*.js paths.
    location ~ ^/(chat|sessions|workspace|environments|lsp|health|slash-commands|plan|session|settings|mcp|ask_user_question|can_use_tool|skills|agents|plugins|tool|scheduled-tasks|browser)(/|$) {
        proxy_pass http://agent:4567;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        chunked_transfer_encoding on;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            access_log off;
            expires    7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
