# Opt-in Cloud Workspace overlay for docker-compose.sso.yml.
#
# Usage:
#   docker compose -f deploy/docker-compose.sso.yml \
#     -f deploy/docker-compose.sso.cloud.yml --env-file deploy/.env up -d

services:
  agent:
    environment:
      BAIZE_RUNTIME_PROFILE: cloud
      CLOUD_WORKSPACES: docker
      WORKSPACE_IMAGE: '${WORKSPACE_IMAGE:-agent-workspace:latest}'
      WORKSPACE_INSTANCE: '${WORKSPACE_INSTANCE:-sso}'
      WORKSPACE_NETWORK: '${WORKSPACE_NETWORK:-agent-ws}'
      WORKSPACE_MEMORY: '${WORKSPACE_MEMORY:-2g}'
      WORKSPACE_CPUS: '${WORKSPACE_CPUS:-2}'
      WORKSPACE_IDLE_MINUTES: '${WORKSPACE_IDLE_MINUTES:-30}'
      WORKSPACE_MAX_PER_USER: '${WORKSPACE_MAX_PER_USER:-5}'
    volumes:
      # Root-equivalent host capability. It is intentionally absent from the
      # base SSO stack and mounted only for the explicit Cloud profile.
      - /var/run/docker.sock:/var/run/docker.sock
