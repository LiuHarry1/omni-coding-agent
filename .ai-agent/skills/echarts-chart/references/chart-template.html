<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline data chart</title>
<style>
  :root{
    color-scheme:light;
    --bg:#e8eef5;
    --bg-glow:#d7e8f4;
    --paper:#ffffff;
    --ink:#0f1c2e;
    --muted:#5b6b7c;
    --line:#d7e0ea;
    --line-soft:#edf2f7;
    --accent:#0f766e;
    --accent-soft:rgba(15,118,110,.08);
    --shadow:0 22px 60px rgba(15,28,46,.10);
    --control:#f7fafc;
  }
  *{box-sizing:border-box}
  body{
    font-family:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    margin:0;
    padding:14px 16px;
    min-height:100vh;
    background:
      radial-gradient(ellipse 70% 45% at 12% -10%,var(--bg-glow),transparent 55%),
      radial-gradient(ellipse 50% 40% at 100% 0%,#eef2ff,transparent 45%),
      linear-gradient(180deg,#f3f6fa 0%,var(--bg) 100%);
    color:var(--ink);
  }
  body[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b1220;
    --bg-glow:#16324a;
    --paper:#121a27;
    --ink:#e8eef6;
    --muted:#93a4b8;
    --line:#273348;
    --line-soft:#1a2433;
    --accent:#2dd4bf;
    --accent-soft:rgba(45,212,191,.12);
    --shadow:0 22px 60px rgba(0,0,0,.45);
    --control:#182233;
  }
  body[data-theme="dark"]{
    background:
      radial-gradient(ellipse 70% 45% at 10% -8%,rgba(45,212,191,.12),transparent 50%),
      radial-gradient(ellipse 45% 35% at 100% 0%,rgba(59,130,246,.10),transparent 45%),
      linear-gradient(180deg,#0d1524 0%,var(--bg) 100%);
  }
  main{
    max-width:min(1040px,100%);
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  header{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  h1{
    font-size:clamp(17px,2vw,24px);
    font-weight:700;
    line-height:1.25;
    letter-spacing:-.02em;
    margin:0 0 4px;
  }
  #description{color:var(--muted);font-size:13px;line-height:1.45;margin:0;max-width:72ch}
  #controls{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:8px 18px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--muted);background:linear-gradient(180deg,var(--control),transparent);
  }
  #controls label{display:flex;gap:8px;align-items:center}
  #controls select,#controls button{
    font:inherit;color:var(--ink);background:var(--paper);
    padding:7px 11px;border:1px solid var(--line);border-radius:10px;
    transition:border-color .15s ease,box-shadow .15s ease,color .15s ease;
  }
  #controls select:focus,#controls button:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  #controls button{cursor:pointer;margin-left:auto;font-weight:600}
  #controls button:hover{border-color:var(--accent);color:var(--accent)}
  #chart-shell{padding:4px 10px 0}
  #chart{width:960px;height:480px;max-width:100%;margin:0 auto}
  #table-wrap{padding:12px 18px;overflow:auto;max-height:min(480px,60vh)}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:650;background:var(--control)}
  footer{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;
    padding:10px 18px 12px;border-top:1px solid var(--line);
    color:var(--muted);font-size:11px;line-height:1.4;background:var(--control);
  }
  footer strong{display:block;color:var(--ink);font-weight:650;margin-bottom:3px}
  .hidden{display:none!important}
  @media(max-width:680px){
    body{padding:8px}
    main{border-radius:12px}
    header,#controls,footer,#chart-shell{padding-left:12px;padding-right:12px}
    #controls button{margin-left:0}
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <p id="description"></p>
  </header>
  <div id="controls">
    <label>View <select id="type"></select></label>
    <label>Palette
      <select id="palette">
        <option value="default">Studio</option>
        <option value="warm">Warm</option>
        <option value="cool">Cool</option>
        <option value="business">Business</option>
      </select>
    </label>
    <button id="download" type="button">Download cleaned data</button>
  </div>
  <div id="chart-shell">
    <div id="chart" role="img" aria-label="Interactive data chart"></div>
  </div>
  <div id="table-wrap" class="hidden"></div>
  <footer>
    <div id="source"></div>
    <div id="period"></div>
    <div id="unit"></div>
    <div id="quality"></div>
  </footer>
</main>
<script>/*__ECHARTS_RUNTIME__*/</script>
<script>
const D=/*__CHART_PAYLOAD__*/null;
const records=D.data;
const yFields=Array.isArray(D.fields.y)?D.fields.y:[D.fields.y];
let chart=null;

function unitFor(field){
  if(typeof D.unit==='string')return D.unit;
  return D.unit&&D.unit[field]?D.unit[field]:'';
}
function formatValue(value,field){
  if(value==null)return '—';
  const abs=Math.abs(value);
  const digits=abs!==0&&abs<1?2:abs<100?1:0;
  return Number(value).toLocaleString(undefined,{maximumFractionDigits:digits})+(unitFor(field)?' '+unitFor(field):'');
}
function ink(){return D.theme==='dark'?'#e8eef6':'#0f1c2e'}
function muted(){return D.theme==='dark'?'#93a4b8':'#5b6b7c'}
function gridLine(){return D.theme==='dark'?'#273348':'#e2e8f0'}
function axisLine(){return D.theme==='dark'?'#334155':'#cbd5e1'}
function paper(){return D.theme==='dark'?'#121a27':'#ffffff'}
function tooltipTheme(){
  return {
    backgroundColor:D.theme==='dark'?'rgba(15,23,42,.94)':'rgba(15,28,46,.94)',
    borderWidth:0,
    padding:[10,14],
    textStyle:{color:'#f8fafc',fontSize:12,fontFamily:'Segoe UI, PingFang SC, Microsoft YaHei, sans-serif'},
    extraCssText:'border-radius:12px;box-shadow:0 16px 40px rgba(15,28,46,.22);backdrop-filter:blur(8px);'
  };
}
function hexToRgba(hex,alpha){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return 'rgba(15,118,110,'+alpha+')';
  const n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+alpha+')';
}
function baseOption(colors){
  return {
    backgroundColor:'transparent',
    color:colors,
    animationDuration:520,
    animationEasing:'cubicOut',
    textStyle:{color:ink(),fontFamily:'Segoe UI, PingFang SC, Microsoft YaHei, sans-serif'},
    aria:{enabled:true,decal:{show:false}},
    tooltip:Object.assign({confine:true,axisPointer:{type:'line',lineStyle:{color:hexToRgba(colors[0],.35),width:1.5}}},tooltipTheme()),
    legend:{
      bottom:2,type:'scroll',icon:'roundRect',itemWidth:14,itemHeight:8,itemGap:16,
      textStyle:{color:muted(),fontSize:12}
    },
    grid:{left:56,right:28,top:42,bottom:72,containLabel:true}
  };
}
function categoryAxis(cats){
  const dense=cats.length>12;
  return {
    type:'category',
    data:cats,
    boundaryGap:true,
    axisTick:{show:false},
    axisLine:{lineStyle:{color:axisLine()}},
    axisLabel:{
      color:muted(),
      hideOverlap:true,
      rotate:dense?36:cats.length>8?24:0,
      margin:14,
      fontSize:dense?11:12,
      interval:dense?Math.ceil(cats.length/14)-1:0
    },
    splitLine:{show:false}
  };
}
function valueAxis(name){
  return {
    type:'value',
    name:name||'',
    nameTextStyle:{color:muted(),padding:[0,0,0,8]},
    axisTick:{show:false},
    axisLine:{show:false},
    axisLabel:{color:muted(),fontSize:12},
    splitLine:{lineStyle:{color:gridLine(),type:'dashed',width:1}},
    splitNumber:4
  };
}
function annotationLines(){
  return D.annotations.length?{
    silent:true,symbol:['none','none'],
    label:{formatter:p=>p.name,color:muted(),fontSize:11,distance:8},
    lineStyle:{type:'dashed',width:1.2,color:muted()},
    data:D.annotations.map(a=>({name:a.label,xAxis:String(a.x)}))
  }:undefined;
}
function seriesExtras(type,color,index){
  const extras={
    emphasis:{focus:'series',itemStyle:{shadowBlur:10,shadowColor:hexToRgba(color,.35)}},
    markLine:index===0?annotationLines():undefined
  };
  if(type==='line'||type==='area'){
    extras.smooth=0.28;
    extras.showSymbol=records.length<=24;
    extras.symbol='circle';
    extras.symbolSize=7;
    extras.lineStyle={width:3,cap:'round',join:'round'};
    extras.itemStyle={borderColor:paper(),borderWidth:2};
    if(type==='area'||(type==='line'&&yFields.length===1)){
      extras.areaStyle={
        opacity:type==='area'?0.22:0.12,
        color:{
          type:'linear',x:0,y:0,x2:0,y2:1,
          colorStops:[
            {offset:0,color:hexToRgba(color,type==='area'?0.34:0.22)},
            {offset:1,color:hexToRgba(color,0.02)}
          ]
        }
      };
    }
  }
  if(type==='bar'||type==='stacked_bar'||type==='histogram'){
    extras.barMaxWidth=yFields.length>1?36:48;
    extras.barCategoryGap=records.length>10?'28%':'42%';
    extras.itemStyle={
      borderRadius:type==='stacked_bar'?[0,0,0,0]:[8,8,0,0],
      color:{
        type:'linear',x:0,y:0,x2:0,y2:1,
        colorStops:[
          {offset:0,color:hexToRgba(color,0.95)},
          {offset:1,color:hexToRgba(color,0.72)}
        ]
      }
    };
  }
  return extras;
}
function axisOption(type,colors){
  const option=baseOption(colors);
  const cats=records.map(r=>String(r[D.fields.x]));
  const seriesType=type==='area'?'line':type==='stacked_bar'?'bar':type==='histogram'?'bar':type;
  const commonSeries=yFields.map((field,index)=>{
    const color=colors[index%colors.length];
    return Object.assign({
      name:field,
      type:seriesType,
      data:records.map(r=>r[field]),
      connectNulls:false,
      stack:type==='stacked_bar'?'total':undefined
    },seriesExtras(type==='histogram'?'bar':type,color,index));
  });
  if(type==='stacked_bar'){
    commonSeries.forEach((s,i)=>{
      const last=i===commonSeries.length-1;
      s.itemStyle=Object.assign({},s.itemStyle,{borderRadius:last?[8,8,0,0]:[0,0,0,0]});
    });
  }
  const ranking=D.goal==='ranking'&&type==='bar';
  if(ranking){
    commonSeries.forEach((s,index)=>{
      const color=colors[index%colors.length];
      s.barMaxWidth=22;
      s.itemStyle={
        borderRadius:[0,8,8,0],
        color:{
          type:'linear',x:0,y:0,x2:1,y2:0,
          colorStops:[
            {offset:0,color:hexToRgba(color,0.7)},
            {offset:1,color:hexToRgba(color,0.95)}
          ]
        }
      };
    });
  }
  return Object.assign(option,{
    tooltip:Object.assign({
      trigger:'axis',
      confine:true,
      valueFormatter:v=>formatValue(v,yFields[0]),
      axisPointer:{type:ranking?'shadow':'line',shadowStyle:{color:hexToRgba(colors[0],.08)},lineStyle:{color:hexToRgba(colors[0],.35),width:1.5}}
    },tooltipTheme()),
    xAxis:ranking?valueAxis():categoryAxis(cats),
    yAxis:ranking?{
      type:'category',data:cats,inverse:true,axisTick:{show:false},
      axisLine:{show:false},axisLabel:{color:muted(),fontSize:12},
      splitLine:{show:false}
    }:valueAxis(typeof D.unit==='string'?D.unit:''),
    series:commonSeries
  });
}
function pieOption(type,colors){
  const field=yFields[0];
  const option=baseOption(colors);
  option.tooltip=Object.assign({
    trigger:'item',
    formatter:p=>'<div style="font-weight:600;margin-bottom:4px">'+p.name+'</div>'+formatValue(p.value,field)+'<br><span style="opacity:.8">'+p.percent+'%</span>'
  },tooltipTheme());
  option.legend={bottom:2,type:'scroll',textStyle:{color:muted()}};
  option.series=[{
    name:field,type:'pie',radius:type==='donut'?['46%','72%']:'70%',
    center:['50%','46%'],
    data:records.map(r=>({name:String(r[D.fields.x]),value:r[field]})),
    padAngle:2,
    itemStyle:{borderWidth:3,borderColor:paper(),borderRadius:6},
    label:{
      formatter:'{b}\n{d}%',
      color:ink(),
      fontSize:12,
      lineHeight:16
    },
    labelLine:{length:14,length2:10,lineStyle:{color:axisLine()}},
    emphasis:{
      scale:true,
      scaleSize:6,
      itemStyle:{shadowBlur:16,shadowColor:'rgba(15,28,46,.18)'}
    }
  }];
  return option;
}
function scatterOption(colors){
  const option=baseOption(colors);
  option.tooltip=Object.assign({
    trigger:'item',
    formatter:p=>'<div style="font-weight:600;margin-bottom:4px">'+p.seriesName+'</div>'+D.fields.x+': '+formatValue(p.value[0],D.fields.x)+'<br>'+formatValue(p.value[1],p.seriesName)
  },tooltipTheme());
  option.xAxis=Object.assign(valueAxis(D.fields.x),{splitLine:{lineStyle:{color:gridLine(),type:'dashed'}}});
  option.yAxis=valueAxis(typeof D.unit==='string'?D.unit:'');
  option.series=yFields.map((field,index)=>({
    name:field,type:'scatter',symbolSize:12,
    itemStyle:{
      color:hexToRgba(colors[index%colors.length],0.82),
      borderColor:paper(),borderWidth:2,
      shadowBlur:8,shadowColor:hexToRgba(colors[index%colors.length],0.25)
    },
    data:records.map(r=>[r[D.fields.x],r[field]])
  }));
  return option;
}
function heatmapOption(colors){
  const option=baseOption(colors);
  const xs=[...new Set(records.map(r=>String(r[D.fields.x])))];
  const yField=yFields[0],ys=[...new Set(records.map(r=>String(r[yField])))];
  const values=records.map(r=>r[D.fields.value]);
  option.grid={left:80,right:70,top:30,bottom:80,containLabel:true};
  option.tooltip=Object.assign({
    position:'top',
    formatter:p=>xs[p.value[0]]+' / '+ys[p.value[1]]+'<br>'+formatValue(p.value[2],D.fields.value)
  },tooltipTheme());
  option.xAxis={type:'category',data:xs,splitArea:{show:true},axisLabel:{color:muted()},axisTick:{show:false}};
  option.yAxis={type:'category',data:ys,splitArea:{show:true},axisLabel:{color:muted()},axisTick:{show:false}};
  option.visualMap={
    min:Math.min(...values),max:Math.max(...values),calculable:true,orient:'vertical',right:4,top:'middle',
    inRange:{color:[hexToRgba(colors[0],0.15),colors[0],colors[1]||colors[0]]},
    textStyle:{color:muted()}
  };
  option.series=[{
    name:D.fields.value,type:'heatmap',
    data:records.map(r=>[xs.indexOf(String(r[D.fields.x])),ys.indexOf(String(r[yField])),r[D.fields.value]]),
    label:{show:records.length<=36,color:ink()},
    itemStyle:{borderRadius:4,borderColor:paper(),borderWidth:2}
  }];
  return option;
}
function boxplotOption(colors){
  const option=baseOption(colors);
  option.tooltip=Object.assign({trigger:'item'},tooltipTheme());
  option.xAxis=categoryAxis(records.map(r=>String(r[D.fields.x])));
  option.yAxis=valueAxis(typeof D.unit==='string'?D.unit:'');
  option.series=[{
    name:'Five-number summary',type:'boxplot',
    data:records.map(r=>yFields.map(f=>r[f])),
    itemStyle:{color:hexToRgba(colors[0],0.18),borderColor:colors[0],borderWidth:2},
    boxWidth:['28%','48%']
  }];
  return option;
}
function paretoOption(colors){
  const option=baseOption(colors),field=yFields[0];
  const values=records.map(r=>r[field]),total=values.reduce((a,b)=>a+b,0);
  let running=0;
  const cumulative=values.map(v=>{running+=v;return total?running/total*100:0});
  option.tooltip=Object.assign({trigger:'axis'},tooltipTheme());
  option.xAxis=categoryAxis(records.map(r=>String(r[D.fields.x])));
  option.yAxis=[
    valueAxis(unitFor(field)),
    Object.assign(valueAxis('Cumulative %'),{min:0,max:100,axisLabel:{formatter:'{value}%',color:muted()},splitLine:{show:false}})
  ];
  option.series=[
    Object.assign({name:field,type:'bar',data:values},seriesExtras('bar',colors[0],0)),
    {
      name:'Cumulative %',type:'line',yAxisIndex:1,data:cumulative,smooth:0.2,
      showSymbol:true,symbolSize:7,lineStyle:{width:3,color:colors[1]||'#ea580c'},
      itemStyle:{color:colors[1]||'#ea580c',borderColor:paper(),borderWidth:2}
    }
  ];
  return option;
}
function buildOption(type,palette){
  const colors=D.palettes[palette]||D.palettes.default;
  if(type==='pie'||type==='donut')return pieOption(type,colors);
  if(type==='scatter')return scatterOption(colors);
  if(type==='heatmap')return heatmapOption(colors);
  if(type==='boxplot')return boxplotOption(colors);
  if(type==='pareto')return paretoOption(colors);
  return axisOption(type,colors);
}
function compatibleTypes(){
  if(D.chartType==='table')return ['table'];
  if(D.chartType==='pie'||D.chartType==='donut')return ['donut','pie','bar'];
  if(D.chartType==='line'||D.chartType==='area')return ['line','area','bar'];
  if(D.chartType==='histogram')return ['histogram','bar','line','area'];
  if(D.chartType==='bar'||D.chartType==='stacked_bar')return yFields.length>1?['bar','stacked_bar','line']:['bar','line','area'];
  return [D.chartType];
}
function renderTable(){
  document.getElementById('chart').classList.add('hidden');
  const wrap=document.getElementById('table-wrap');
  wrap.classList.remove('hidden');
  const fields=[...new Set(records.flatMap(Object.keys))];
  const table=document.createElement('table');
  const head=document.createElement('thead'),hr=document.createElement('tr');
  fields.forEach(f=>{const th=document.createElement('th');th.textContent=f;hr.appendChild(th);});
  head.appendChild(hr);table.appendChild(head);
  const body=document.createElement('tbody');
  records.forEach(r=>{const tr=document.createElement('tr');fields.forEach(f=>{const td=document.createElement('td');td.textContent=r[f]==null?'':String(r[f]);tr.appendChild(td);});body.appendChild(tr);});
  table.appendChild(body);wrap.replaceChildren(table);
}
function fitChartBox(){
  const el=document.getElementById('chart');
  const chrome=168;
  const sidePad=40;
  const width=Math.max(320,Math.min(D.width,window.innerWidth-sidePad));
  const height=Math.max(260,Math.min(D.height,window.innerHeight-chrome));
  el.style.width=width+'px';
  el.style.height=height+'px';
  return {width,height};
}
function render(){
  const type=document.getElementById('type').value;
  if(type==='table'){if(chart){chart.dispose();chart=null;}renderTable();document.body.dataset.chartReady='true';return;}
  document.getElementById('table-wrap').classList.add('hidden');
  document.getElementById('chart').classList.remove('hidden');
  const size=fitChartBox();
  if(!chart)chart=echarts.init(document.getElementById('chart'),null,{renderer:'canvas'});
  chart.setOption(buildOption(type,document.getElementById('palette').value),true);
  chart.resize(size);
  chart.on('finished',()=>{document.body.dataset.chartReady='true';});
}
function meta(id,label,value){
  const el=document.getElementById(id);
  if(value==null||value===''||(Array.isArray(value)&&!value.length)){el.classList.add('hidden');return;}
  const strong=document.createElement('strong');strong.textContent=label;
  el.append(strong,document.createTextNode(Array.isArray(value)?value.join(' · '):String(value)));
}
function init(){
  document.body.dataset.theme=D.theme;
  document.title=D.title;
  document.getElementById('title').textContent=D.title;
  const description=document.getElementById('description');
  description.textContent=D.description||'';
  if(!D.description)description.classList.add('hidden');
  const select=document.getElementById('type');
  compatibleTypes().forEach(type=>{const option=document.createElement('option');option.value=type;option.textContent=type.replace('_',' ');select.appendChild(option);});
  select.value=D.chartType;
  meta('source','Source',D.source);
  meta('period','Time range',D.timeRange?D.timeRange.start+' — '+D.timeRange.end+(D.timeRange.timezone?' · '+D.timeRange.timezone:''):'');
  meta('unit','Unit',typeof D.unit==='string'?D.unit:D.unit?Object.entries(D.unit).map(([k,v])=>k+': '+v):'');
  const quality=[D.missingValuePolicy+' missing-value policy'];
  if(D.incompletePeriod)quality.push(D.incompletePeriod.label+(D.incompletePeriod.note?' — '+D.incompletePeriod.note:''));
  if(D.topN)quality.push('Top '+D.topN+(D.includeOther?' + Other':''));
  meta('quality','Data notes',quality);
  select.addEventListener('change',render);
  document.getElementById('palette').addEventListener('change',render);
  document.getElementById('download').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({title:D.title,fields:D.fields,unit:D.unit,records:D.data},null,2)+'\n'],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=D.downloadName;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  });
  render();
  window.addEventListener('resize',()=>{
    if(!chart)return;
    chart.resize(fitChartBox());
  });
}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
